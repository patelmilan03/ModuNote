name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Landing A — quality gate (analyze + lint + test)
  # ──────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modunote

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      - name: Install host sqlite3 (Drift tests need it)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Decode firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Custom lint (riverpod_lint)
        run: |
          OUTPUT=$(dart run custom_lint 2>&1) || true
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -q "No issues found"; then
            echo "::error::custom_lint found issues"
            exit 1
          fi

      - name: Test
        run: |
          RESULT=$(flutter test 2>&1) || EXIT_CODE=$?
          echo "$RESULT"
          # Fail on skips — a skip means sqlite3 is missing on the runner
          if echo "$RESULT" | grep -qE '~[0-9]+'; then
            echo "::error::Tests had skips — likely missing libsqlite3-dev"
            exit 1
          fi
          exit ${EXIT_CODE:-0}

      - name: Cleanup decoded configs
        if: always()
        run: rm -f lib/firebase_options.dart

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Everything below is user-controlled text. It goes through env vars
          # (never `${{ }}` in the script body, which GitHub substitutes BEFORE
          # the shell parses — a quote or backtick would break or inject) and is
          # encoded into JSON by jq, which escapes quotes/backslashes/newlines.
          JOB_STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi

          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993
            EMOJI="✅"
          else
            COLOR=15158332
            EMOJI="❌"
          fi

          # Subject line only, bounded well under Discord's 1024-char field cap.
          SUBJECT=$(printf '%s' "$COMMIT_MESSAGE" | head -1 | cut -c1-500)
          [ -n "$SUBJECT" ] || SUBJECT="(no commit message)"

          SHORT_SHA="${GITHUB_SHA:0:7}"
          # head_commit is null on pull_request events — degrade to a plain sha.
          if [ -n "$COMMIT_URL" ]; then
            COMMIT_FIELD="[\`${SHORT_SHA}\`](${COMMIT_URL})"
          else
            COMMIT_FIELD="\`${SHORT_SHA}\`"
          fi

          jq -n \
            --arg title "${EMOJI} Quality Gate — ${JOB_STATUS}" \
            --argjson color "$COLOR" \
            --arg branch "\`${BRANCH}\`" \
            --arg commit "$COMMIT_FIELD" \
            --arg message "$SUBJECT" \
            --arg url "$RUN_URL" \
            '{embeds: [{
                title: $title,
                color: $color,
                fields: [
                  {name: "Branch",  value: $branch,  inline: true},
                  {name: "Commit",  value: $commit,  inline: true},
                  {name: "Message", value: $message, inline: false}
                ],
                url: $url,
                footer: {text: "ModuNote CI"}
              }]}' \
            | curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK_URL" -d @-
        working-directory: .

  # ──────────────────────────────────────────────
  # Landing B — signed release APK + Firebase App Distribution
  # ──────────────────────────────────────────────
  release:
    name: Release & Distribute
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: modunote

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      - name: Set up Node.js (for Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > lib/firebase_options.dart

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/modunote-release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=/tmp/modunote-release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          CLEAN_API_BASE_URL=$(printf '%s' "$API_BASE_URL" | tr -d '[:space:]')
          echo "API_BASE_URL length: ${#CLEAN_API_BASE_URL} chars"
          flutter build apk --release --dart-define=API_BASE_URL="$CLEAN_API_BASE_URL" --build-number=${{ github.run_number }}

      - name: Write service account JSON
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json

      - name: Distribute via Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
          # Passed as an env var, NOT interpolated into the script body — a
          # commit message containing a quote or backtick would otherwise break
          # (or inject into) the shell.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          npm install -g firebase-tools

          # Firebase App Distribution caps release notes at 5000 chars, and a
          # full commit body easily exceeds that. Use the subject line only,
          # hard-truncated well under the cap.
          SUBJECT=$(printf '%s' "$COMMIT_MESSAGE" | head -1 | cut -c1-500)
          RELEASE_NOTES="Build #${{ github.run_number }} (${GITHUB_SHA:0:7}) — ${SUBJECT}"

          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_ANDROID_APP_ID }}" \
            --groups milan \
            --release-notes "$RELEASE_NOTES"

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f /tmp/modunote-release.jks
          rm -f /tmp/firebase-sa.json
          rm -f android/key.properties
          rm -f android/app/google-services.json
          rm -f lib/firebase_options.dart

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # See the quality job's notify step for why these go through env + jq
          # instead of being interpolated into the script body.
          JOB_STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi

          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993
            EMOJI="🚀"
            DESC="APK distributed to Firebase App Tester"
          else
            COLOR=15158332
            EMOJI="❌"
            DESC="Release failed — check the logs"
          fi

          # Subject line only, bounded well under Discord's 1024-char field cap.
          SUBJECT=$(printf '%s' "$COMMIT_MESSAGE" | head -1 | cut -c1-500)
          [ -n "$SUBJECT" ] || SUBJECT="(no commit message)"

          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ -n "$COMMIT_URL" ]; then
            COMMIT_FIELD="[\`${SHORT_SHA}\`](${COMMIT_URL})"
          else
            COMMIT_FIELD="\`${SHORT_SHA}\`"
          fi

          jq -n \
            --arg title "${EMOJI} Release #${BUILD_NUMBER} — ${JOB_STATUS}" \
            --arg desc "$DESC" \
            --argjson color "$COLOR" \
            --arg branch "\`${BRANCH}\`" \
            --arg commit "$COMMIT_FIELD" \
            --arg build "#${BUILD_NUMBER}" \
            --arg message "$SUBJECT" \
            --arg url "$RUN_URL" \
            '{embeds: [{
                title: $title,
                description: $desc,
                color: $color,
                fields: [
                  {name: "Branch",  value: $branch,  inline: true},
                  {name: "Commit",  value: $commit,  inline: true},
                  {name: "Build",   value: $build,   inline: true},
                  {name: "Message", value: $message, inline: false}
                ],
                url: $url,
                footer: {text: "ModuNote CI"}
              }]}' \
            | curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK_URL" -d @-
        working-directory: .
