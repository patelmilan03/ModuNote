name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Landing A — quality gate (analyze + lint + test)
  # ──────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modunote

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      - name: Install host sqlite3 (Drift tests need it)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Decode firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Custom lint (riverpod_lint)
        run: |
          OUTPUT=$(dart run custom_lint 2>&1) || true
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -q "No issues found"; then
            echo "::error::custom_lint found issues"
            exit 1
          fi

      - name: Test
        run: |
          RESULT=$(flutter test 2>&1) || EXIT_CODE=$?
          echo "$RESULT"
          # Fail on skips — a skip means sqlite3 is missing on the runner
          if echo "$RESULT" | grep -qE '~[0-9]+'; then
            echo "::error::Tests had skips — likely missing libsqlite3-dev"
            exit 1
          fi
          exit ${EXIT_CODE:-0}

      - name: Cleanup decoded configs
        if: always()
        run: rm -f lib/firebase_options.dart

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi

          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            EMOJI="✅"
          else
            COLOR=15158332
            EMOJI="❌"
          fi

          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1 | sed 's/"/\\"/g' | sed "s/'/\\'/g")
          SHORT_SHA="${GITHUB_SHA:0:7}"

          curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK_URL" -d "{
            \"embeds\": [{
              \"title\": \"${EMOJI} Quality Gate — ${{ job.status }}\",
              \"color\": ${COLOR},
              \"fields\": [
                { \"name\": \"Branch\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true },
                { \"name\": \"Commit\", \"value\": \"[\`${SHORT_SHA}\`](${{ github.event.head_commit.url }})\", \"inline\": true },
                { \"name\": \"Message\", \"value\": \"${COMMIT_MSG}\", \"inline\": false }
              ],
              \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"footer\": { \"text\": \"ModuNote CI\" }
            }]
          }"
        working-directory: .

  # ──────────────────────────────────────────────
  # Landing B — signed release APK + Firebase App Distribution
  # ──────────────────────────────────────────────
  release:
    name: Release & Distribute
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: modunote

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      - name: Set up Node.js (for Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > lib/firebase_options.dart

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/modunote-release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=/tmp/modunote-release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            --build-number=${{ github.run_number }}

      - name: Write service account JSON
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json

      - name: Distribute via Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_ANDROID_APP_ID }}" \
            --groups milan \
            --release-notes "Build #${{ github.run_number }} — ${{ github.event.head_commit.message }}"

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f /tmp/modunote-release.jks
          rm -f /tmp/firebase-sa.json
          rm -f android/key.properties
          rm -f android/app/google-services.json
          rm -f lib/firebase_options.dart

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi

          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            EMOJI="🚀"
            DESC="APK distributed to Firebase App Tester"
          else
            COLOR=15158332
            EMOJI="❌"
            DESC="Release failed — check the logs"
          fi

          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1 | sed 's/"/\\"/g' | sed "s/'/\\'/g")
          SHORT_SHA="${GITHUB_SHA:0:7}"

          curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK_URL" -d "{
            \"embeds\": [{
              \"title\": \"${EMOJI} Release #${{ github.run_number }} — ${{ job.status }}\",
              \"description\": \"${DESC}\",
              \"color\": ${COLOR},
              \"fields\": [
                { \"name\": \"Branch\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true },
                { \"name\": \"Commit\", \"value\": \"[\`${SHORT_SHA}\`](${{ github.event.head_commit.url }})\", \"inline\": true },
                { \"name\": \"Build\", \"value\": \"#${{ github.run_number }}\", \"inline\": true },
                { \"name\": \"Message\", \"value\": \"${COMMIT_MSG}\", \"inline\": false }
              ],
              \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"footer\": { \"text\": \"ModuNote CI\" }
            }]
          }"
        working-directory: .
